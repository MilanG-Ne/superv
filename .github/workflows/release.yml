name: Release

# Publishing a GitHub release builds the .deb and attaches it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        run: |
          version=$(/usr/bin/python3 -c 'import superv; print(superv.__version__)')
          test "v$version" = "${{ github.event.release.tag_name }}"

      - name: Build .deb
        run: packaging/build-deb.sh

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber
